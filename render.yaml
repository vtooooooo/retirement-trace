services:
  - type: web
    name: pensiontrace-api
    runtime: python
    branch: feature/pensiontrace
    region: oregon
    plan: free
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: python -m pensiontrace.hosting initialize && exec uvicorn pensiontrace.api:app --host 0.0.0.0 --port "$PORT" --workers 1 --limit-concurrency 12 --timeout-keep-alive 5
    healthCheckPath: /health/live
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PT_HOSTED
        value: "1"
      - key: PT_FRONTEND_ORIGINS
        sync: false
      - key: PT_EDGE_SECRET
        sync: false
      - key: PT_DEMO_ACCOUNTS
        sync: false
      - key: DATABASE_URL
        sync: false
